<template>
    <lightning-card title="PickList values">
         <lightning-combobox
            name="progress"
            label="Industry Picklist"
            value={selectedValue}
            placeholder="Select Industry"
            options={industryOptions}
            onchange={handleChange} ></lightning-combobox>

    <p>Selected value is: {selectedValue}</p>


    <lightning-combobox
            name="progress"
            label="Type Picklist"
            value={selectedType}
            placeholder="Select Type"
            options={typeVal}
            onchange={onPicklistHandleChange} ></lightning-combobox>

    <p>Selected value is: {selectedType}</p>

    <lightning-combobox
            name="progress"
            label="Rating Picklist"
            value={ratingVal}
            placeholder="Select Type"
            options={ratingOptions}
            onchange={onRatingChange} ></lightning-combobox>

    <p>Selected value is: {ratingVal}</p>
    </lightning-card>
</template>
