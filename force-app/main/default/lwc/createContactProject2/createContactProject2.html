<template>
    <lightning-card title="Personal Information">
         <lightning-progress-indicator current-step={stepVal} type="path" variant="base">
        <lightning-progress-step label="Basic Details" value="1"></lightning-progress-step>
        <lightning-progress-step label="Contact Details" value="2"></lightning-progress-step>
        <lightning-progress-step label="Review and Submit" value="3"></lightning-progress-step>
    </lightning-progress-indicator>
        <div class="slds-p-around_large">

            <!-- Title -->
            <lightning-input label="Title" name="title" value={title} onchange={handleChange}>
            </lightning-input>

            <!-- First Name & Last Name -->
            <div class="slds-grid slds-gutters slds-m-top_medium">

                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="First Name" name="firstName" value={firstName} onchange={handleChange}>
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-2">
                    <lightning-input label="Last Name" name="lastName" value={lastName} onchange={handleChange}>
                    </lightning-input>
                </div>

            </div>

            <!-- Buttons -->
            <div class="button-container slds-m-top_x-large">

                <lightning-button label="Previous" variant="neutral" onclick={handlePrevious}>
                </lightning-button>

                <lightning-button label="Next" variant="brand" onclick={handleNext}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>
</template>
