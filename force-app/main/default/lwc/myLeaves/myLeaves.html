<template>
    <lightning-card>
        <lightning-button-icon
        icon-name="utility:add"
        variant="bare"
        onclick={handleClickAdd}
        alternative-text="Add"
        slot="actions">
    </lightning-button-icon>
        <template if:true={myLeaves}>
            <div>
                <lightning-datatable key-field="id" data={myLeaves} columns={columns} onrowaction={handleRowAction}>
                    
                </lightning-datatable>
            </div>
        </template>
        <template if:true={noRecordsFound}>
            <div class='slds-align_absolute-center slds-p-around_small'>
                <h1>No Leaves data found</h1>
            </div>

        </template>

    </lightning-card>
    <template lwc:if={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <button onclick={popUpCloseHandler} class="slds-button slds-button_icon slds-modal__close">
                <span class="slds-assistive-text">Cancel and close</span>
            </button>
            <div class="slds-modal__header">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Modal header</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <lightning-record-edit-form object-api-name={objectApiName} record-id={recordId} onsuccess={successHandler} onsubmit={submitHandler} lwc:ref="leaveRequestForm">
                    <lightning-input-field field-name="User__c" value={currentUserId}> </lightning-input-field>
                    <lightning-input-field field-name="From_Date__c" onchange={handleChange}> </lightning-input-field>
                    <lightning-input-field field-name="To_Date__c" onchange={handleChange}> </lightning-input-field>
                    <lightning-input-field field-name="Reason__c"> </lightning-input-field>
                    <div class="slds-var-m-top_medium">
                        <lightning-button variant="brand" type="submit" label="Save">
                        </lightning-button>

                        <lightning-button variant="brand" label="Cancel" onclick={cancelHandler}>
                        </lightning-button>
                    </div>
                </lightning-record-edit-form>
            </div>
            <div class="slds-modal__footer">
                
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
    
</template>
